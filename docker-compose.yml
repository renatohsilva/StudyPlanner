services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: studyplanner-postgres
    environment:
      POSTGRES_DB: studyplanner
      POSTGRES_USER: studyplanner
      POSTGRES_PASSWORD: studyplanner
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyplanner -d studyplanner"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: studyplanner-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
