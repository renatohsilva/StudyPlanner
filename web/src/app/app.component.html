<nav class="topnav">
  <span class="brand">StudyPlanner</span>

  @if (authService.isAuthenticated()) {
    <a routerLink="/exam-setup">Concurso</a>
    <a routerLink="/dashboard">Hoje</a>
    <a routerLink="/weekly-plan">Semana</a>
    <a routerLink="/materials">Materiais</a>
    <a routerLink="/questions">Questões</a>

    <span class="spacer"></span>
    <span class="user-name">{{ authService.name() }}</span>
    <button class="link" (click)="logout()">Sair</button>
  } @else {
    <span class="spacer"></span>
    <a routerLink="/login">Entrar</a>
    <a routerLink="/register">Criar conta</a>
  }
</nav>

<router-outlet />
